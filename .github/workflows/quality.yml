name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly mutation testing on Sundays at 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # Minimal env vars for tests
  DATABASE_URL: "sqlite:./db/test.sqlite3?mode=rwc"
  DATABASE_PROVIDER: "sqlite"
  JWT_SECRET: "test-secret-key-for-ci-only-32chars"

jobs:
  # ===========================================================================
  # Server Tests with Coverage (Rust/Cargo)
  # ===========================================================================
  server-tests:
    name: Server Tests (95% Coverage Gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Create test database directory
        run: mkdir -p db

      - name: Run tests with coverage
        run: |
          cargo tarpaulin \
            --out Xml \
            --out Lcov \
            --all-features \
            --workspace \
            --timeout 120 \
            --exclude-files "**/migrations/*" \
            --exclude-files "**/tests/*" \
            --exclude-files "src/main.rs" \
            --ignore-panics \
            --ignore-tests \
            --fail-under 95

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: server/lcov.info
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: |
            server/cobertura.xml
            server/lcov.info

  # ===========================================================================
  # Client Tests (SvelteKit/Vitest)
  # ===========================================================================
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check

      - name: Run linter
        run: bun run lint

      # Note: Vitest unit tests not yet configured
      # Uncomment when vitest is added to the project:
      # - name: Run unit tests with coverage
      #   run: bun run test:unit --coverage
      #
      # - name: Check coverage threshold
      #   run: |
      #     # Enforce 95% coverage threshold
      #     bun run test:unit --coverage --coverage.thresholds.lines=95

  # ===========================================================================
  # End-to-End Tests (Playwright)
  # ===========================================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: client
        run: bun playwright install --with-deps chromium

      - name: Build server
        working-directory: server
        run: |
          mkdir -p db
          cargo build --release

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Run E2E tests
        working-directory: client
        run: bun playwright test
        env:
          # E2E test environment
          CLIENT_PORT: "8080"
          SERVER_PORT: "8081"
          SERVER_URL: "http://localhost:8081"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  # ===========================================================================
  # Mutation Testing (Weekly on main only)
  # ===========================================================================
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # Only run on schedule (weekly) or manual trigger, and only on main
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-
            ${{ runner.os }}-cargo-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Create test database directory
        run: mkdir -p db

      - name: Run mutation testing
        run: |
          cargo mutants \
            --timeout 300 \
            --jobs 2 \
            --output mutants-report \
            -- --all-features
        continue-on-error: true  # Don't fail CI, this is informational

      - name: Upload mutation testing report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-testing-report
          path: server/mutants-report/
          retention-days: 30

      - name: Comment mutation testing summary
        if: always()
        run: |
          if [ -f mutants-report/caught.txt ]; then
            caught=$(wc -l < mutants-report/caught.txt)
          else
            caught=0
          fi
          if [ -f mutants-report/missed.txt ]; then
            missed=$(wc -l < mutants-report/missed.txt)
          else
            missed=0
          fi
          total=$((caught + missed))
          if [ $total -gt 0 ]; then
            score=$((caught * 100 / total))
          else
            score=0
          fi
          echo "## Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mutants Caught | $caught |" >> $GITHUB_STEP_SUMMARY
          echo "| Mutants Missed | $missed |" >> $GITHUB_STEP_SUMMARY
          echo "| Mutation Score | ${score}% |" >> $GITHUB_STEP_SUMMARY
